# Publishes web/ as the live dapp.
# One-time setup (3 steps, in this order):
#   1. Repo must be PUBLIC (GitHub Pages is not available on private repos on the free plan).
#   2. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   3. Settings > Secrets and variables > Actions > Variables > New variable: PAGES_ENABLED = true
# Until step 3 the job is skipped instead of failing red (a failed Pages job: "Get Pages site failed ... Not Found" means 1 or 2 is missing).
name: Pages
on:
  push:
    branches: [main]
    paths: ["web/**", "contracts/**", "agent/policy.js", "scripts/build-web.js", "package.json", "package-lock.json", "hardhat.config.js", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx hardhat compile && npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deployment
        uses: actions/deploy-pages@v4
